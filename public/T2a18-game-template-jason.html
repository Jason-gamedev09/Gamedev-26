


<body id="myBody" style="background-image: url(''); background-repeat: repeat-x; background-size: cover; background-attachment: fixed; margin: 0; height: 100vh;">

<h1 align=center>t2a18-game-template-fred</h1>
<h2 align=center>NOTE: Images are place holders to differentiate the different elements</h2>
<h3 id="keyCounter">Keys: 0</h3>
<br><br><br><br>

<script>

   // global variables here
   let myGlobalX = 0
   let myClock
   let myKey = 0

   // global functions here
function myHitOther(my1,my2){
   left1   = parseInt(document.getElementById(my1).style.left)
   right1  = left1 + parseInt(document.getElementById(my1).style.width)
   top1    = parseInt(document.getElementById(my1).style.top)   
   bottom1 = top1   + parseInt(document.getElementById(my1).style.height)
   left2   = parseInt(document.getElementById(my2).style.left)
   right2  = left2 + parseInt(document.getElementById(my2).style.width)
   top2    = parseInt(document.getElementById(my2).style.top)   
   bottom2 = top2   + parseInt(document.getElementById(my2).style.height)
   if ((right1  >=  left2  ) &&      	   
       (bottom1 >=  top2   ) &&
       (left1   <=  right2 ) &&
       (top1    <=  bottom2) ){
       return true
   }
}


function myCheckHit(){
   if ( myHitOther('myImg01','myImg02') ){
       if (myKey == 1){
       alert('TEST ALERT: you win (you hit goal img2)')  
       document.getElementById('myImg01').style.left = '20px'
       location = 't2a13-keydown.html' 
       }// go to your next level
   }
   if ( myHitOther('myImg01','myImg03') ){
       alert('TEST ALERT: you lose (you hit enemy img3)')  
       document.getElementById('myImg01').style.left = '20px'
   }
   if (myHitOther('myImg01','myImg04')){
    myKey = 1
    document.getElementById('keyCounter').innerHTML = 'Keys: ' + myKey

    document.getElementById('myImg04').style.display = 'none'
   }
   // more if statements here like the above

}  // end of myCheckHit()

 
</script>

<img id="myImg01" style="position:absolute; width:100px; height:80px; top:750px; left:50px;"  src="https://minecraft.wiki/images/thumb/AMCM_Steve.png/150px-AMCM_Steve.png?82619">
<img id="myImg02" style="position:absolute; width:100px; height:80px; top:600px; left:350px;" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToPMAtFX46ETmjJhYcIpCPpURk0MjNio0PAj5t56_T3g&s=10">
<img id="myImg03" style="position:absolute; width:100px; height:80px; top:750px; left:250px;" src="https://i.pinimg.com/736x/9b/1b/df/9b1bdf645fd086068e79988d4719bdae.jpg">
<img id="myImg04" style="position:absolute; width:100px; height:80px; top:550px; left:70px;" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQIH-AjRrWzD3-Fncos_PZSKYRGony0lXjA8u_XKORipg&s=10">
   
<input type=button value="Auto Background Left" onclick="{
  clearInterval(myClock)
  let myTemp = '100px 0px'
  myClock = setInterval(function(){
      myGlobalX -= 5
      myTemp =  myGlobalX + 'px 0px'
      document.getElementById('myBody').style.backgroundPosition = myTemp
  }, 50)
    
}">
<br><br>

<input type=button value="Image Right Fast Button" ontouchStart="{this.click(); event.preventDefault();}" onclick="{
  document.getElementById('myImg01').style.left = parseInt(document.getElementById('myImg01').style.left) + 10 + 'px'
  myCheckHit()     // checks for all collisions
}"><br><br>

 <input type=button value="Image left Fast Button" ontouchStart="{this.click(); event.preventDefault();}" onclick="{
  document.getElementById('myImg01').style.left = parseInt(document.getElementById('myImg01').style.left) - 10 + 'px'
  myCheckHit()     // checks for all collisions
}"><br><br>
   
<input type=button value="Image up Fast Button" ontouchStart="{this.click(); event.preventDefault();}" onclick="{
  document.getElementById('myImg01').style.top = parseInt(document.getElementById('myImg01').style.top) - 10 + 'px'
  myCheckHit()     // checks for all collisions
}"><br><br>

<input type=button value="Image down Fast Button" ontouchStart="{this.click(); event.preventDefault();}" onclick="{
  document.getElementById('myImg01').style.top = parseInt(document.getElementById('myImg01').style.top) + 10 + 'px'
  myCheckHit()     // checks for all collisions
}"><br><br>
