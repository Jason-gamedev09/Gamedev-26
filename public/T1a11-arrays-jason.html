  <h4> Carousel using an array tray </h4>
  <div style="background: #f0f0f0; padding: 20px; font-size: 24px;" id="carousel">
  Loading slides...
</div>

<script>
 
  const slides = [" D E M O C R A C Y ", "  ⬆️  ⬇️  ⬅️  ➡️ ", " E A G L E "];
  let currentIndex = 0;

  function rotateSlides() {
    document.getElementById("carousel").innerText = slides[currentIndex];
    currentIndex = (currentIndex + 1) % slides.length;
  }

  setInterval(rotateSlides, 1000);
  rotateSlides();
</script>

<h4>List searcher using arrays and filters</h4>
  <input type="text" id="searchBox" onkeyup="filterProducts()" placeholder="Search gadgets...">
  <ul id="productResult"></ul>

  <script>
    const inventory = ["Eagle", "Pelican", "Space Station", "Hammer", "Jetpack", "Maelstrom","Bastion","Recon Vehicle","Ghillie suit"];

  function filterProducts() {
    let query = document.getElementById("searchBox").value.toLowerCase();  
      
    let filtered = inventory.filter(item => item.toLowerCase().includes(query)); 
     document.getElementById("productResult").innerHTML = 
        filtered.map(item => `<li>${item}</li>`).join("");
    }

    filterProducts();
  </script>
