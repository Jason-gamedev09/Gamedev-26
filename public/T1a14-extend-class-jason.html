<script>
  class myAnimal {
    constructor(passName, passAge) {
      this.myName = passName;
      this.myAge = passAge;
  }
  myShow(){
    document.getElementById('myDiv01').innerHTML = 'hello ' + this.myName +
'. You are ' + this.myAge + ' years old<br>'
  }
} //end class myAnimal
 </script>
<h2 align=center>T1a14-extend class-jason.html</h2>
Extending a pre-existing Class<br>


<h4> Example Working Class Code</h4>
<input type=button value="Example Class Set and Show Class Animal" onclick="{
  
  myDog = new myAnimal('Snickers', 5)
  myDog.myShow()
}">
