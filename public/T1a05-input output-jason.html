<pre>

<h4> Example working code</h4>

<input id="myNum01" type=number value="4" ><br>

<input type=button value="myEvent squares" onclick="{
  let myIn01 = parseFloat(document.getElementById('myNum01').value)
  let myAnswer = myIn01 * myIn01
  document.getElementById('myDiv01').innerHTML = myIn01 + ' squared = ' + myAnswer
}"><br>

<div id="myDiv01">...</div>

<h4> I made it multiply </h4>
<input id="myNum02" type=number value="4" ><br>
<input id="myNum03" type=number value="6" ><br>

<input type=button value="myEvent multiply" onclick="{
  let myIn02 = parseFloat(document.getElementById('myNum02').value)
  let myIn03 = parseFloat(document.getElementById('myNum03').value)
  let myAnswer = myIn02 * myIn03
  document.getElementById('myDiv02').innerHTML = myIn02 + ' multiplied by ' + myIn03 + ' = ' + myAnswer
}"><br>
<input type=button value="myEvent divide" onclick="{
  let myIn02 = parseFloat(document.getElementById('myNum02').value)
  let myIn03 = parseFloat(document.getElementById('myNum03').value)
  let myAnswer = myIn02 / myIn03
  document.getElementById('myDiv02').innerHTML = myIn02 + ' divided by ' + myIn03 + ' = ' + myAnswer
}">
