<h1 align=center>t2a20-sort-jason.html</h1>

<script>
   let myMax = 52    //52 when working
   let myCards = new Array(myMax)
   
   // script for animation
   const mySleep = (ms) => new Promise(r => setTimeout(r, ms))

   function myShow(spot1 = -1, spot2 = -1) {
   let myTemp = ''
   for (let myLoop = 0; myLoop < myCards.length; myLoop++){
      if (myLoop === spot1 || myLoop === spot2) {

         myTemp += '<mark style="background:yellow; font-weight:bold;">' + myLoop + ' = ' + myCards[myLoop] + '</mark><br>'
      } else {
         myTemp += myLoop + ' = ' + myCards[myLoop] + '<br>'
      }
   }
   document.getElementById('myDiv01').innerHTML = myTemp
}

</script>

<input type=button value="Set Random" onclick="(async () => {
   for (let myLoop = 0;  myLoop < myMax; myLoop++){
      myCards[myLoop] = Math.floor(Math.random()*10)
    }
    myShow()
  })()">

  <input type=button value="Show" onclick="(async () => {
    let myTemp = ''
     for (let myLoop = 0;  myLoop < myMax; myLoop++){
    myTemp += myLoop + ' = '+ myCards[myLoop] + '<br>'
  }
    document.getElementById('myDiv01').innerHTML = myTemp
})()">

<input type=button value="sort" onclick="(async () => {
  let myTemp = 0
  for (let myOuter = 0; myOuter < myMax; myOuter++){
     for (let myLoop = 0; myLoop < myMax - 1; myLoop++){
        if (myCards[myLoop] > myCards[myLoop + 1]){
           myTemp = myCards[myLoop]
           myCards[myLoop] = myCards[myLoop + 1]
           myCards[myLoop + 1] = myTemp
           
           myShow(myLoop, myLoop + 1)
           await mySleep(300)
     }
    }
  }
  myShow()
})()">
<div id="myDiv01"></div>

<h2> Other sort methods</h2>

<h3>Selection Sort</h3>
<input type=button value="Selection Sort" onclick="(async () => {
  let myTemp = 0
  for (let myOuter = 0; myOuter < myMax - 1; myOuter++){
     let myMinIndex = myOuter
     for (let myLoop = myOuter + 1; myLoop < myMax; myLoop++){
        if (myCards[myLoop] < myCards[myMinIndex]){
           myMinIndex = myLoop
        }
     }
     myTemp = myCards[myOuter]
     myCards[myOuter] = myCards[myMinIndex]
     myCards[myMinIndex] = myTemp
     
          myShow(myOuter, myMinIndex)
     await mySleep(300)
  }
  myShow
})()">

<h3>Insertion Sort</h3>
<input type=button value="Insertion Sort" onclick="(async () => {
  for (let myOuter = 1; myOuter < myMax; myOuter++){
     let myCurrent = myCards[myOuter]
     let myLoop = myOuter - 1
     while (myLoop >= 0 && myCards[myLoop] > myCurrent){
        myCards[myLoop + 1] = myCards[myLoop]
        myLoop--
        
        myShow(myLoop, myLoop + 1)
        await mySleep(300)
     }
     myCards[myLoop + 1] = myCurrent
     myShow()
  }
})()">

<h3> Built In Java Sort</h3>
<input type=button value="Built-in Sort" onclick="(async () => {
  myCards.sort(function(a, b){
     return a - b
  })
  myShow()
})()">

<h3>Bogosort (Randomly Sorts)</h3>
<input type=button value="Bogosort" onclick="(async () => {
  let isSorted = false
  
  while (!isSorted) {
    // Shuffle the cards randomly
    for (let myLoop = myMax - 1; myLoop > 0; myLoop--) {
      let randIndex = Math.floor(Math.random() * (myLoop + 1))
      let myTemp = myCards[myLoop]
      myCards[myLoop] = myCards[randIndex]
      myCards[randIndex] = myTemp
      
      // Move this inside the loop so it can highlight each swap as it happens
      myShow(myLoop, randIndex)
      await mySleep(200)
    }

    // Check if sorted
    isSorted = true
    for (let myLoop = 0; myLoop < myMax - 1; myLoop++) {
      if (myCards[myLoop] > myCards[myLoop + 1]) {
        isSorted = false
        break
      }
    }
  }
  myShow()
})()">

<h3>Stalin Sort (It makes any number out of line disapear)</h3>

<input type=button value="Stalin Sort" onclick="(async () => {
  let myCurrentMax = myCards[0]
  let myLoop = 1
  
  while (myLoop < myCards.length) {
    myShow(myLoop - 1, myLoop)
    await mySleep(300)

    if (myCards[myLoop] >= myCurrentMax) {
      myCurrentMax = myCards[myLoop]
      myLoop++
    } else {

      myCards.splice(myLoop, 1)
    }
  }
  myShow()
})()">

<h3>Pancake Sort (flips a number and everything above the number like a stack of pancakes</h3>

<input type=button value="Pancake Sort" onclick="(async () => {

  for (let myOuter = myMax; myOuter > 1; myOuter--) {

    let myMaxIndex = 0

    for (let myLoop = 1; myLoop < myOuter; myLoop++) {
      if (myCards[myLoop] > myCards[myMaxIndex]) {
        myMaxIndex = myLoop
      }
    }

    for (let myLoop = 0; myLoop < myMaxIndex; myLoop++) {
      let myTemp = myCards[myLoop]
      myCards[myLoop] = myCards[myMaxIndex]
      myCards[myMaxIndex] = myTemp

      myMaxIndex--
      myShow(myLoop, myMaxIndex + 1)
      await mySleep(300)
    }

    for (let myLoop = 0; myLoop < Math.floor(myOuter / 2); myLoop++) {
      let myTemp = myCards[myLoop]
      myCards[myLoop] = myCards[myOuter - 1 - myLoop]
      myCards[myOuter - 1 - myLoop] = myTemp

      myShow(myLoop, myOuter - 1 - myLoop)
      await mySleep(300)
    }

  }

  myShow()

})()">
