<h4> More Cool Stuff </h4>
<h3> Matrix type code falling visual: </h3>
<textarea id="box" rows="12" cols="45" style="background:#1e1e1e; color:#4fc1ff; font-family:monospace; font-size:14px; padding:10px;"></textarea>

  <script>
    const txt = document.getElementById("box");
    const snippets = [
      "let", "const", "function()", "for(let i=0;)", "if(true)", "return;", 
      "console.log()", "<div>", "</div>", "<html>", "<script>", "document.", 
      "fetch()", ".addEventListener", "=>", "class", "import", "export"
    ];

    setInterval(() => {
      let line = "";      
      for (let i = 0; i < 3; i++) {
        let randomCode = snippets[Math.floor(Math.random() * snippets.length)];
        line += randomCode + " ";
      }            
      let lines = txt.value.split("\n");
      if (lines.length > 11) lines.pop(); 
      
      txt.value = line + "\n" + lines.join("\n");
    }, 70);
  </script>

<h3>Fillable Grid</h3>
<div id="grid" style="display: grid; grid-template-columns: repeat(10, 30px); gap: 2px;"></div>

<script>
  const grid = document.getElementById('grid');
 
  for (let i = 0; i < 100; i++) {
    const square = document.createElement('div');      
    
    square.style.cssText = "width: 30px; height: 30px; background: #eee;";   
    
    square.onmouseover = () => square.style.background = 'black';
    
    grid.appendChild(square);
  }
</script>
