
<h2>t2a22-local-storage-fred.html</h2>

Use local storage to make a to-do list

<body onload="{
   myStorage = localStorage.getItem('myStoredText')
   if(myStorage  != null){
      document.getElementById('myText1').value = myStorage 
    }
}">

<body onunload="{
   localstorage.setItem('myStoredText',document.getElementById('myText1').value)
}">   

Text example: <input id="myText1" type=text size=70 value="" placeholder="Write here to store"><br>

<input type="button" value="Store Text" onClick="{
   localStorage.setItem('myStoredText', document.getElementById('myText1').value)
   alert(document.getElementById('myText1').value + ' \nHas been stored')
   document.getElementById('myText1').value = ''
}">

<input type="button" value="Retrieve Text" onClick="{
   document.getElementById('myText1').value = localStorage.getItem('myStoredText')
}"> 

<h3>To-Do List (Make Sure You Click Store Text</h3>

<input id="myTodoInput" type="text" size="50" placeholder="Enter a new task...">

<input type="button" value="Add Task" onClick="{
   let taskText = document.getElementById('myTodoInput').value;
   if (taskText !== '') {
      let list = document.getElementById('myList');
      list.innerHTML += '<li>' + taskText + ' <input type=\'button\' value=\'Remove\' onclick=\'this.parentElement.remove(); localStorage.setItem(&quot;myTodoList&quot;, document.getElementById(&quot;myList&quot;).innerHTML);\'></li>';
      localStorage.setItem('myTodoList', list.innerHTML);
      document.getElementById('myTodoInput').value = '';
   }
}">

<input type="button" value="Clear All" onClick="{
   document.getElementById('myList').innerHTML = '';
   localStorage.removeItem('myTodoList');
}">

<ul id="myList"></ul>

<script>
   let savedTodos = localStorage.getItem('myTodoList');
   if (savedTodos != null) {
      document.getElementById('myList').innerHTML = savedTodos;
   }
</script>

</body>
